          </select>

      <div class="key-display">

          <div class="key-value">

<script setup>
import { ref, onMounted } from 'vue'

const apiBaseUrl = 'https://stzb.kaoqin.txy.hanyuxin.cn/v1'

// 新密钥表单
const newKey = ref({
  serviceName: '',
  serviceId: '',
  description: '',
  expireDays: '90'
})

const generating = ref(false)
const generatedKey = ref(null)
const keys = ref([])
const exampleKey = ref(null)

// 生成唯一ID
function generateUniqueId() {
  return 'svc_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36)
}

// 生成API密钥
function generateApiKey() {
  return 'sk_' + Array.from({ length: 48 }, () => 
    'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.floor(Math.random() * 62)]
  ).join('')
}

// 生成密钥
async function generateKey() {
  generating.value = true
  
  try {
    const keyData = {
      id: Date.now().toString(),
      serviceName: newKey.value.serviceName,
      serviceId: newKey.value.serviceId || generateUniqueId(),
      apiKey: generateApiKey(),
      description: newKey.value.description,
      createdAt: new Date().toISOString(),
      isActive: true
    }

    // 设置过期时间
    if (newKey.value.expireDays !== '0') {
      const days = parseInt(newKey.value.expireDays)
      const expireDate = new Date()
      expireDate.setDate(expireDate.getDate() + days)
      keyData.expiresAt = expireDate.toISOString()
    }

    // 保存到localStorage（实际应该保存到后端数据库）
    const savedKeys = JSON.parse(localStorage.getItem('ai_keys') || '[]')
    savedKeys.push(keyData)
    localStorage.setItem('ai_keys', JSON.stringify(savedKeys))

    // 显示生成的密钥
    generatedKey.value = keyData
    exampleKey.value = keyData
    
    // 刷新列表
    loadKeys()

    // 重置表单
    newKey.value = {
      serviceName: '',
      serviceId: '',
      description: '',
      expireDays: '90'
    }
  } catch (error) {
    console.error('生成密钥失败:', error)
    alert('生成密钥失败: ' + error.message)
  } finally {
    generating.value = false
  }
}

// 加载密钥列表
function loadKeys() {
  const savedKeys = JSON.parse(localStorage.getItem('ai_keys') || '[]')
  keys.value = savedKeys.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
}

// 掩码显示密钥
function maskKey(key) {
  if (!key) return ''
  return key.substring(0, 8) + '...' + key.substring(key.length - 4)
}

// 显示完整密钥
function showFullKey(key) {
  if (confirm('确定要查看完整密钥吗？请确保周围环境安全。')) {
    alert(`API密钥: ${key.apiKey}\n\n请妥善保管，不要泄露给他人！`)
  }
}

// 切换密钥状态
function toggleKeyStatus(key) {
  key.isActive = !key.isActive
  saveKeys()
}

// 重新生成密钥
function regenerateKey(key) {
  if (confirm('确定要重新生成密钥吗？旧密钥将立即失效。')) {
    key.apiKey = generateApiKey()
    key.regeneratedAt = new Date().toISOString()
    saveKeys()
    alert('密钥已重新生成，请妥善保管新密钥！')
  }
}

// 删除密钥
function deleteKey(key) {
  if (confirm(`确定要删除密钥 "${key.serviceName}" 吗？此操作不可恢复！`)) {
    const index = keys.value.findIndex(k => k.id === key.id)
    if (index > -1) {
      keys.value.splice(index, 1)
      saveKeys()
    }
  }
}

// 保存密钥到localStorage
function saveKeys() {
  localStorage.setItem('ai_keys', JSON.stringify(keys.value))
}

// 复制到剪贴板
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制到剪贴板')
  }).catch(err => {
    console.error('复制失败:', err)
  })
}

// 下载配置文件
function downloadKeyConfig() {
  if (!generatedKey.value) return

  const config = {
    apiUrl: apiBaseUrl,
    serviceId: generatedKey.value.serviceId,
    apiKey: generatedKey.value.apiKey,
    serviceName: generatedKey.value.serviceName,
    createdAt: generatedKey.value.createdAt
  }

  const blob = new Blob([JSON.stringify(config, null, 2)], {
    type: 'application/json'
  })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `ai-key-config-${Date.now()}.json`
  a.click()
  URL.revokeObjectURL(url)
}

// 格式化日期
function formatDate(dateString) {
  if (!dateString) return '-'
  const date = new Date(dateString)
  return date.toLocaleString('zh-CN')
}

// 检查是否即将过期
function isExpiringSoon(expiresAt) {
  if (!expiresAt) return false
  const expireDate = new Date(expiresAt)
  const now = new Date()
  const daysUntilExpire = (expireDate - now) / (1000 * 60 * 60 * 24)
  return daysUntilExpire <= 7 && daysUntilExpire > 0
}

// 页面加载时获取密钥列表
onMounted(() => {
  loadKeys()
})
</script>
